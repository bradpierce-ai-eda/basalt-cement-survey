<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img">
<title>Evidence travels with the material and the claim</title><desc>Source identity, date, language and sample or process connect to direct observations of composition, phases, methods, conditions and measured endpoints, then to proposed mechanisms, retained comparators and recorded uncertainty. Evidence classes distinguish tested experiments, patent embodiments, modeled boundaries and inputs, dated industry statements, standard scope and edition, and measured operation. Disclosure or calculation is not automatically operating performance.</desc>
<rect width="1800" height="1050" fill="white"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#50717d"/></marker></defs>
<text x="70" y="82" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172f3c">Evidence travels with the material and the claim</text>
<rect x="70" y="160" width="510" height="290" rx="14" fill="#edf3f5" stroke="#50717d" stroke-width="3"/>
<text x="92" y="207" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172f3c">SOURCE RECORD</text>
<text x="92" y="255" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Original identity</text>
<text x="92" y="295" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Date / language</text>
<text x="92" y="335" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Sample or process</text>
<line x1="580" y1="300" x2="620" y2="300" stroke="#50717d" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="635" y="160" width="510" height="290" rx="14" fill="#edf3f5" stroke="#50717d" stroke-width="3"/>
<text x="657" y="207" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172f3c">DIRECT OBSERVATION</text>
<text x="657" y="255" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Composition / phases</text>
<text x="657" y="295" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Methods / conditions</text>
<text x="657" y="335" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Measured endpoint</text>
<line x1="1145" y1="300" x2="1185" y2="300" stroke="#50717d" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="1200" y="160" width="510" height="290" rx="14" fill="#edf3f5" stroke="#50717d" stroke-width="3"/>
<text x="1222" y="207" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172f3c">INTERPRETATION</text>
<text x="1222" y="255" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Mechanism proposed</text>
<text x="1222" y="295" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Comparator retained</text>
<text x="1222" y="335" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Uncertainty recorded</text>
<rect x="70" y="550" width="790" height="330" rx="14" fill="#edf3f5" stroke="#50717d" stroke-width="3"/>
<text x="92" y="597" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172f3c">DISTINCT EVIDENCE CLASSES</text>
<text x="92" y="645" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Experiment: tested specimen</text>
<text x="92" y="685" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Patent: disclosed embodiment</text>
<text x="92" y="725" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Model: assumed boundary and inputs</text>
<rect x="960" y="550" width="770" height="330" rx="14" fill="#edf3f5" stroke="#50717d" stroke-width="3"/>
<text x="982" y="597" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172f3c">APPLICATION BOUNDARY</text>
<text x="982" y="645" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Industry: dated operator statement</text>
<text x="982" y="685" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Standard: identified scope and edition</text>
<text x="982" y="725" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#172f3c">Operation: measured product and output</text>
<text x="70" y="990" font-family="Arial, sans-serif" font-size="30" font-weight="400" fill="#172f3c">No automatic promotion from disclosure or calculation to operating performance.</text>
</svg>